[package]
name = "arut-feature-chat"
version.workspace = true
edition.workspace = true
license-file = "../../LICENSE-FSL"

[features]
test-support = []

[dependencies]
arut-authority.workspace = true
arut-i18n-macros.workspace = true
arut-protocol.workspace = true
arut-rpc.workspace = true
arut-storage.workspace = true
arut-watch.workspace = true
boltffi = "=0.30.1"
futures-util = "0.3.34"
prost = "0.14.4"
tracing = "0.1.44"
thiserror = "2.0.20"
uuid = { version = "1.26.1", default-features = false, features = ["std"] }

[dev-dependencies]
arut-storage = { workspace = true, features = ["redb"] }
uuid = { version = "1.26.1", features = ["v7"] }
futures-executor = "0.3.34"
futures-lite = { version = "2.6.1", default-features = false, features = ["std"] }

[lints]
workspace = true
