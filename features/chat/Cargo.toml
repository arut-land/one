[package]
name = "arut-feature-chat"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
arut-authority.workspace = true
arut-storage.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
boltffi = "=0.30.1"
arut-protocol.workspace = true
arut-rpc.workspace = true
arut-watch.workspace = true
futures-util = "0.3.31"
uuid = { version = "1.18.1", default-features = false, features = ["std"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
uuid = { version = "1.18.1", features = ["v7"] }

[dev-dependencies]
futures-executor = "0.3.31"
