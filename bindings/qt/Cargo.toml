[package]
name = "arut-bindings-qt"
version.workspace = true
edition.workspace = true
license.workspace = true
links = "arut_bindings_qt"

[dependencies]
arut-feature-chat.workspace = true
arut-product-session.workspace = true
arut-watch.workspace = true
cxx = "1.0.199"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_gui", "qt_qml"] }
futures-executor = "0.3.31"

[build-dependencies]
cxx-qt-build = { version = "0.10.0", features = ["link_qt_object_files"] }
