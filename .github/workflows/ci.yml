name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Pushes supersede each other; a manual dispatch keeps its own group so a
# later push cannot cancel a verification someone asked for.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    # The Linux surface needs GTK >= 4.20 (ADR 0013, ADR 0020) for the portal
    # color-scheme reading; Ubuntu 24.04 ships 4.14, so the job runs in a
    # Fedora container, which tracks current GTK.
    container: fedora:latest
    # GitHub sets HOME=/github/home inside containers while the process runs as
    # root; rustup refuses that mismatch, so the job pins HOME to root's home.
    env:
      HOME: /root
    steps:
      - name: Install GTK4 and build prerequisites
        run: dnf install -y gtk4-devel gcc gcc-c++ pkgconf-pkg-config git curl tar gzip xz unzip which

      # `buf breaking --against '.git#branch=master'` needs the baseline commit,
      # and ECOSYSTEM's Phase 1 plan adds cargo-semver-checks, which needs one
      # too, so a shallow clone would have to be reverted later.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare protocol baseline
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if ! git show-ref --verify --quiet refs/heads/master; then
            git branch master origin/master
          fi

      - uses: jdx/mise-action@v2

      - uses: Swatinem/rust-cache@v2

      # One entry point for humans and CI: mise.toml owns what "check" means.
      - name: mise run check
        run: mise run check

      - name: mise run build
        run: mise run build

  # Its own job, so an advisory-database fetch failure neither masks a compile
  # failure nor blocks the build step.
  deps:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run check:deps

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
      - run: mise run check:windows

  macos:
    name: macOS
    runs-on: macos-latest
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - uses: Swatinem/rust-cache@v2

      - name: Build ArutMac and test Swift bindings
        run: mise run check:apple
