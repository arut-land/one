name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Android path filter
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.paths.outputs.android }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Android inputs
        id: paths
        shell: bash
        env:
          ARUT_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          ARUT_DIFF_HEAD: ${{ github.sha }}
        run: |
          if [[ -z "$ARUT_DIFF_BASE" || "$ARUT_DIFF_BASE" =~ ^0+$ ]]; then
            git ls-tree -r --name-only "$ARUT_DIFF_HEAD" > changed-paths
          else
            git diff --no-renames --name-only "$ARUT_DIFF_BASE" "$ARUT_DIFF_HEAD" > changed-paths
          fi
          android=false
          while IFS= read -r path; do
            case "$path" in
              surfaces/android/*|bindings/kotlin/*|bindings/ffi/*|features/*|product/*|substrates/*|protocols/*|runtimes/*|Cargo.lock)
                android=true
                break
                ;;
            esac
          done < changed-paths
          echo "android=$android" >> "$GITHUB_OUTPUT"
  linux:
    name: Linux
    runs-on: ubuntu-latest
    # The Linux surface needs GTK >= 4.20 (ADR 0013, ADR 0020) for the portal
    # color-scheme reading; Ubuntu 24.04 ships 4.14, so the job runs in a
    # Fedora container, which tracks current GTK.
    container: fedora:latest
    steps:
      - name: Install GTK4 and build prerequisites
        run: dnf install -y gtk4-devel gcc gcc-c++ pkgconf-pkg-config git curl tar gzip xz unzip which

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare protocol baseline
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if ! git show-ref --verify --quiet refs/heads/master; then
            git branch master origin/master
          fi

      - uses: Swatinem/rust-cache@v2

      - uses: jdx/mise-action@v2

      - name: Install toolchains
        run: mise install

      # One entry point for humans and CI: mise.toml owns what "check" means.
      - name: mise run check
        run: mise run check

      - name: mise run build
        run: mise run build

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125"

      - uses: jdx/mise-action@v2

      - name: Install toolchains
        run: mise install

      # BoltFFI packs four Android targets; mise only installs wasm32 for the
      # workspace, so the Android targets are added here, and the NDK that
      # setup-android installed is exported for the linker.
      - name: Add Android Rust targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android

      # This machine has no Android emulator or device, so only the build
      # itself is verified here, not the app running.
      - name: Build Android surface
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: mise run surface:android

  macos:
    name: macOS
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - uses: jdx/mise-action@v2

      - name: Install toolchains
        run: mise install

      - name: Generate Apple bindings
        run: mise run ffi:apple

      - name: Generate Xcode project
        run: mise run surface:apple-project

      # Speculative: this step has not been run on this machine (no Xcode
      # available here), so the scheme name and build settings are inferred
      # from surfaces/apple/project.yml rather than verified end to end.
      - name: Build ArutMac
        run: xcodebuild -project surfaces/apple/Arut.xcodeproj -scheme ArutMac build CODE_SIGNING_ALLOWED=NO
