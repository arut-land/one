name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Linux surface links against GTK4 (ADR 0013), so its dev headers
      # must be present before any cargo command touches the workspace.
      - name: Install GTK4 development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev build-essential pkg-config

      - uses: Swatinem/rust-cache@v2

      - uses: jdx/mise-action@v2

      - name: Install toolchains
        run: mise install

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo nextest
        run: cargo nextest run --workspace

      - name: cargo test (doctests)
        run: cargo test --doc --workspace

      - name: cargo machete
        run: cargo machete

      - name: cargo deny
        run: cargo deny check

      - name: cargo check (wasm)
        run: cargo check -p arut_ffi --target wasm32-unknown-unknown

      # docs/ECOSYSTEM.md's wasm rule: the BoltFFI wasm core does not use
      # wasm-bindgen, so nothing pulling it in may reach arut_ffi's wasm
      # dependency graph.
      - name: Assert no wasm-bindgen in arut_ffi's wasm graph
        run: |
          leaked="$(cargo tree -i wasm-bindgen --target wasm32-unknown-unknown -p arut_ffi 2>/dev/null)"
          if [ -n "$leaked" ]; then
            echo "wasm-bindgen leaked into the arut_ffi wasm dependency graph:"
            echo "$leaked"
            exit 1
          fi

      - name: cargo check (wasm, arut-i18n)
        run: cargo check -p arut-i18n --target wasm32-unknown-unknown

      # The Fluent string source is read by the wasm core's consumers too, so
      # it lives under the same rule as arut_ffi.
      - name: Assert no wasm-bindgen in arut-i18n's wasm graph
        run: |
          leaked="$(cargo tree -i wasm-bindgen --target wasm32-unknown-unknown -p arut-i18n 2>/dev/null)"
          if [ -n "$leaked" ]; then
            echo "wasm-bindgen leaked into the arut-i18n wasm dependency graph:"
            echo "$leaked"
            exit 1
          fi

      # ADR 0022: the .ftl files are the source, so a generated resource or
      # accessor that disagrees with them is a change nobody made on purpose.
      - name: Check the generated string resources
        run: cargo run --quiet -p arut-i18n-gen -- --check

      - name: buf lint
        run: buf lint

      - name: buf breaking
        run: mise run protocol:breaking

      - name: Generate wasm bindings and install JS workspace
        run: mise run install

      - name: pnpm check
        run: pnpm check

      - name: pnpm build
        run: pnpm build

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125"

      - uses: jdx/mise-action@v2

      - name: Install toolchains
        run: mise install

      # This machine has no Android emulator or device, so only the build
      # itself is verified here, not the app running.
      - name: Build Android surface
        run: mise run surface:android

  macos:
    name: macOS
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - uses: jdx/mise-action@v2

      - name: Install toolchains
        run: mise install

      - name: Generate Apple bindings
        run: mise run ffi:apple

      - name: Generate Xcode project
        run: mise run surface:apple-project

      # Speculative: this step has not been run on this machine (no Xcode
      # available here), so the scheme name and build settings are inferred
      # from surfaces/apple/project.yml rather than verified end to end.
      - name: Build ArutMac
        run: xcodebuild -project surfaces/apple/Arut.xcodeproj -scheme ArutMac build CODE_SIGNING_ALLOWED=NO
