name: CI

on:
  # A branch with a pull request is checked by the pull_request event alone;
  # a push trigger for every branch would run each job twice per commit.
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Pushes supersede each other; a manual dispatch keeps its own group so a
# later push cannot cancel a verification someone asked for.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    # The Linux surface needs GTK >= 4.22 (ADR 0013, ADR 0020) for the
    # color-scheme, contrast and reduced-motion settings GTK reads from the
    # portal itself; Ubuntu 24.04 ships 4.14, so the job runs in a Fedora
    # container, which tracks current GTK. fedora:latest is Fedora 44 and
    # ships gtk4-devel 4.22.5.
    container: fedora:latest
    # GitHub sets HOME=/github/home inside containers while the process runs as
    # root; rustup refuses that mismatch, so the job pins HOME to root's home.
    env:
      HOME: /root
    steps:
      - name: Install GTK4 and build prerequisites
        run: dnf install -y gtk4-devel gcc gcc-c++ pkgconf-pkg-config git curl tar gzip xz unzip which

      # `buf breaking --against '.git#branch=main'` needs the baseline commit,
      # and ECOSYSTEM's Phase 1 plan adds cargo-semver-checks, which needs one
      # too, so a shallow clone would have to be reverted later.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare protocol baseline
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if ! git show-ref --verify --quiet refs/heads/main; then
            git branch main origin/main
          fi

      - uses: jdx/mise-action@v2

      - uses: Swatinem/rust-cache@v2

      # mise records a blake3 hash of each task's sources under its state
      # directory, and mr-boxington keys cached rustc outputs by content, so
      # both survive a checkout that rewrites every timestamp. Restoring them
      # lets a commit that touches only documentation skip `check:rust`
      # outright. The key is per run with a prefix fallback, so each run
      # publishes the state it ends with. `mise run --force check` is the
      # escape hatch if a task's declared sources ever turn out incomplete.
      - name: Restore mise task state and the Rust action cache
        uses: actions/cache@v4
        with:
          path: |
            /root/.local/state/mise
            /root/.cache/mbx
          key: mise-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: mise-state-${{ runner.os }}-

      # One entry point for humans and CI: mise.toml owns what "check" means.
      # `--affected` is deliberately not used here: the repository-wide gates
      # belong to the root project, which a crate-only change does not select,
      # so an affected run would skip the checks it exists to run.
      - name: mise run check
        run: mise run check

      - name: mise run build
        run: mise run build

  # Its own job, so an advisory-database fetch failure neither masks a compile
  # failure nor blocks the build step.
  deps:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run check:deps

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
      - run: mise run check:windows

  macos:
    name: macOS
    runs-on: macos-latest
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - uses: Swatinem/rust-cache@v2

      - name: Build ArutMac and test Swift bindings
        run: mise run check:apple
