android.useAndroidX=true
# AGP 9 compiles Kotlin itself and would reject the Kotlin Android plugin
# alongside it. This project keeps one pinned Kotlin (libs.versions.toml), so
# the Kotlin Android plugin and the Compose compiler plugin stay on the same
# version instead of tracking whichever compiler AGP happens to bundle. AGP 10
# removes this opt-out; migrating then means dropping `kotlin-android` and
# letting AGP supply the Compose compiler.
android.builtInKotlin=false
# Dexing the Compose and icon libraries exceeds the Gradle daemon default heap.
org.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
