# One place for every Android version. `mise.toml` pins the JDK and Gradle
# themselves; this pins what the build resolves from Google and Maven Central.
[versions]
agp = "9.4.0"
# AGP 9 compiles Kotlin itself, so no Kotlin Android plugin is applied. The
# Compose compiler plugin must match the Kotlin compiler, and applying it at
# this version is what puts that Kotlin Gradle plugin on the build classpath.
kotlin = "2.4.20"
composeBom = "2026.08.00"
# Not in the Compose BOM: `androidx.compose.material3.adaptive` versions on its
# own line, and this is where `currentWindowAdaptiveInfo()` lives.
material3Adaptive = "1.3.0"
# `WindowSizeClass` itself is WindowManager's, and ChatScreen names the type,
# so it is declared rather than taken transitively from material3-adaptive.
window = "1.5.1"
activity = "1.13.0"
lifecycle = "2.11.0"
coroutines = "1.11.0"

[libraries]
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material3-adaptive = { module = "androidx.compose.material3.adaptive:adaptive", version.ref = "material3Adaptive" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
window-core = { module = "androidx.window:window-core", version.ref = "window" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
