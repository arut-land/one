name: Arut
options:
  bundleIdPrefix: dev.arut
settings:
  GENERATE_INFOPLIST_FILE: YES
  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
packages:
  ArutBindings:
    path: ../../bindings/swift
  ArutSurface:
    path: shared
targets:
  ArutMac:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - shared/app
    dependencies:
      - package: ArutBindings
      - package: ArutSurface
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.arut.macos
  ArutiOS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - shared/app
    dependencies:
      - package: ArutBindings
      - package: ArutSurface
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.arut.ios
      TARGETED_DEVICE_FAMILY: "1,2"
  ArutMacUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - tests
    dependencies:
      - target: ArutMac
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.arut.macos.uitests
schemes:
  ArutMac:
    build:
      targets:
        ArutMac: all
        ArutMacUITests: [test]
    test:
      targets:
        - ArutMacUITests
