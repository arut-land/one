name: Arut
options:
  bundleIdPrefix: dev.arut
  # The toolchain the generated project declares it was last checked against.
  # Xcode 26 is the floor: it carries Swift 6.2, which is the manifest level
  # both Package.swift files ask for, and the Liquid Glass APIs the views use.
  xcodeVersion: "26.0"
  # One floor per platform, so no target repeats it. macOS 14 / iOS 17 is what
  # SwiftUI's Observation needs; nothing here needs more.
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
settings:
  GENERATE_INFOPLIST_FILE: YES
  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
packages:
  ArutBindings:
    path: ../../bindings/swift
  ArutSurface:
    path: shared
targets:
  ArutMac:
    type: application
    platform: macOS
    sources:
      - shared/app
    dependencies:
      - package: ArutBindings
      - package: ArutSurface
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.arut.macos
  ArutiOS:
    type: application
    platform: iOS
    sources:
      - shared/app
    dependencies:
      - package: ArutBindings
      - package: ArutSurface
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.arut.ios
      TARGETED_DEVICE_FAMILY: "1,2"
  ArutMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - tests
    dependencies:
      - target: ArutMac
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.arut.macos.uitests
schemes:
  ArutMac:
    build:
      targets:
        ArutMac: all
        ArutMacUITests: [test]
    test:
      targets:
        - ArutMacUITests
