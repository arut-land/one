[package]
name = "arut-linux"
version.workspace = true
edition.workspace = true
license-file = "../../LICENSE-FSL"

[features]
# Fixture actions for tools/review-linux.sh; never compiled into a shipped binary.
review = []

[target.'cfg(target_os = "linux")'.dependencies]
arut-runtime-local.workspace = true
arut-product-session.workspace = true
arut-i18n.workspace = true
gtk = { package = "gtk4", version = "0.11", features = ["v4_22"] }

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies.relm4]
version = "0.11"
default-features = false
features = ["macros"]

[target.'cfg(target_os = "linux")'.dependencies.ashpd]
version = "0.13"
default-features = false
features = ["settings", "gtk4", "glib", "tokio"]

# Only theme.rs needs a `Stream` adapter, for the portal's accent signal.
[target.'cfg(target_os = "linux")'.dependencies.futures-lite]
version = "2.6.1"
default-features = false
features = ["std"]
