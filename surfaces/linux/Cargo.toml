[package]
name = "arut-linux"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
arut-bindings-qt.workspace = true
arut-product-session.workspace = true
cxx-qt-lib = { version = "0.10.0", features = ["qt_gui", "qt_qml", "qt_quickcontrols"] }

[build-dependencies]
cxx-qt-build = { version = "0.10.0", features = ["link_qt_object_files"] }
