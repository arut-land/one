syntax = "proto3";

package arut.chat.v1;

import "arut/chat/composer/v1/composer.proto";

service ChatService {
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc StartChat(StartChatRequest) returns (StartChatResponse);
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse);
}

message SendMessageRequest {
  string command_id = 3;
  string chat_id = 1;
  string text = 2;
}

message SendMessageResponse {
  repeated ChatMessage messages = 1;
}

message StartChatRequest {
  string pending_scope_id = 1;
  string command_id = 2;
  uint64 expected_revision = 3;
  string text = 4;
}

message StartChatResponse {
  string chat_id = 1;
  repeated ChatMessage messages = 2;
  arut.chat.composer.v1.ComposerSnapshot composer = 3;
}

message ChatMessage {
  uint64 id = 1;
  ChatRole role = 2;
  string text = 3;
  // Authority acceptance time in Unix milliseconds; zero for older facts.
  uint64 accepted_at_ms = 4;
}

enum ChatRole {
  CHAT_ROLE_UNSPECIFIED = 0;
  CHAT_ROLE_USER = 1;
  CHAT_ROLE_ASSISTANT = 2;
}

message ListConversationsRequest {}
message Conversation {
  string id = 1;
  repeated ChatMessage messages = 2;
}
message ListConversationsResponse {
  repeated Conversation conversations = 1;
}

// One command commits an atomic batch of transcript and operation facts.
message ChatFact {
  string chat_id = 1;
  string pending_scope_id = 2;
  repeated ChatMessage messages = 3;
  repeated OperationFact operations = 4;
  // Pending draft revision consumed by this accepted start, when recorded.
  optional uint64 pending_revision = 5;
  // Authority acceptance time for this atomic batch, in Unix milliseconds.
  uint64 accepted_at_ms = 6;
}

message OperationFact {
  string operation_id = 1;
  OperationPhase phase = 2;
}

enum OperationPhase {
  OPERATION_PHASE_UNSPECIFIED = 0;
  OPERATION_PHASE_STARTED = 1;
  OPERATION_PHASE_COMPLETED = 2;
}
