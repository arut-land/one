syntax = "proto3";

package arut.chat.v1;

import "arut/chat/composer/v1/composer.proto";

service ChatService {
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc StartChat(StartChatRequest) returns (StartChatResponse);
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse);
  rpc RenameConversation(RenameConversationRequest) returns (RenameConversationResponse);
  rpc DeleteConversation(DeleteConversationRequest) returns (DeleteConversationResponse);
}

message SendMessageRequest {
  string command_id = 3;
  string chat_id = 1;
  string text = 2;
}

message SendMessageResponse {
  repeated ChatMessage messages = 1;
}

message StartChatRequest {
  string pending_scope_id = 1;
  string command_id = 2;
  uint64 expected_revision = 3;
  string text = 4;
}

message StartChatResponse {
  string chat_id = 1;
  repeated ChatMessage messages = 2;
  arut.chat.composer.v1.ComposerSnapshot composer = 3;
}

message ChatMessage {
  uint64 id = 1;
  ChatRole role = 2;
  string text = 3;
  // Authority acceptance time in Unix milliseconds; zero for older facts.
  uint64 accepted_at_ms = 4;
}

enum ChatRole {
  CHAT_ROLE_UNSPECIFIED = 0;
  CHAT_ROLE_USER = 1;
  CHAT_ROLE_ASSISTANT = 2;
}

message ListConversationsRequest {}
message Conversation {
  string id = 1;
  repeated ChatMessage messages = 2;
  optional string title = 3;
}
message ChatProjectionSnapshot {
  repeated Conversation conversations = 1;
  map<string, uint64> consumed_drafts = 2;
}
message ListConversationsResponse {
  repeated Conversation conversations = 1;
}

// One command commits exactly one durable conversation change.
message ChatFact {
  string chat_id = 1;
  oneof change {
    ChatStarted started = 2;
    MessagesSent sent = 3;
    ConversationRenamed renamed = 4;
    ConversationDeleted deleted = 5;
  }
  uint64 accepted_at_ms = 6;
}

message ChatStarted {
  string pending_scope_id = 1;
  uint64 pending_revision = 2;
  repeated ChatMessage messages = 3;
}
message MessagesSent {
  repeated ChatMessage messages = 1;
}
message ConversationRenamed {
  string title = 1;
}
message ConversationDeleted {}

message RenameConversationRequest {
  string chat_id = 1;
  string title = 2;
  string command_id = 3;
}
message RenameConversationResponse {}
message DeleteConversationRequest {
  string chat_id = 1;
  string command_id = 2;
}
message DeleteConversationResponse {}
