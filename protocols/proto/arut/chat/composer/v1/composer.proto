syntax = "proto3";

package arut.chat.composer.v1;

service ComposerService {
  rpc GetComposer(GetComposerRequest) returns (GetComposerResponse);
  rpc ReplaceComposer(ReplaceComposerRequest) returns (ReplaceComposerResponse);
  rpc WatchComposer(WatchComposerRequest) returns (stream WatchComposerResponse);
}

message ComposerScope {
  oneof scope_id {
    string pending_scope_id = 1;
    string chat_id = 2;
  }
}

message GetComposerRequest {
  ComposerScope scope = 1;
}

message GetComposerResponse {
  ComposerSnapshot snapshot = 1;
}

message ComposerSnapshot {
  ComposerScope scope = 1;
  uint64 authority_epoch = 2;
  string text = 3;
  uint64 revision = 4;
}

message ReplaceComposerRequest {
  ComposerScope scope = 1;
  string command_id = 2;
  uint64 authority_epoch = 3;
  uint64 base_revision = 4;
  string text = 5;
}

message ReplaceComposerResponse {
  oneof outcome {
    ComposerCommitApplied applied = 1;
    ComposerRevisionConflict revision_conflict = 2;
    ComposerAuthorityMismatch authority_mismatch = 3;
  }
}

message ComposerCommitApplied {
  DraftReplaced fact = 1;
  ComposerSnapshot snapshot = 2;
  bool duplicate = 3;
}

message ComposerRevisionConflict {
  ComposerSnapshot snapshot = 1;
}

message ComposerAuthorityMismatch {
  uint64 current_epoch = 1;
}

message DraftReplaced {
  ComposerScope scope = 1;
  string command_id = 2;
  uint64 authority_epoch = 3;
  uint64 revision = 4;
  string text = 5;
}

message WatchComposerRequest {
  ComposerScope scope = 1;
  uint64 after_revision = 2;
}

message WatchComposerResponse {
  repeated DraftReplaced facts = 1;
  ComposerSnapshot snapshot = 2;
}

message ComposerAuthorityCheckpoint {
  repeated ComposerScopeCheckpoint chat_scopes = 1;
}

message ComposerScopeCheckpoint {
  ComposerSnapshot snapshot = 1;
  repeated AppliedComposerCommand commands = 2;
  repeated DraftReplaced facts = 3;
}

message AppliedComposerCommand {
  ReplaceComposerRequest command = 1;
  DraftReplaced fact = 2;
}
