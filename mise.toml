# Repository tools are pinned below. Linux also needs system GTK >= 4.20,
# C/C++ compilers and pkg-config; CI lists the Fedora packages.
# Platform toolchains that only some tasks need (dotnet, java,
# gradle, xcodegen) are scoped to those tasks so they are not installed for
# everyone. Machine-specific tuning goes in mise.local.toml (gitignored), for
# example `[env] CARGO_BUILD_JOBS = "4"` on a memory-constrained laptop.

[settings]
lockfile = true
cargo.binstall = true
cargo.binstall_only = true

[tools]
cargo-binstall = "1.23.0"
rust = { version = "1.98.0", components = ["rustfmt", "clippy"], targets = ["wasm32-unknown-unknown"] }
# Other tools are installed only by the tasks that consume them.

[vars]
dotnet_version = "10.0.401"
node_version = "26.8.2"

[task_templates.dotnet]
tools.dotnet = "{{vars.dotnet_version}}"

[task_templates.javascript]
tools.node = "{{vars.node_version}}"
tools.pnpm = "12.3.4"

[task_templates.ffi]
dir = "{{config_root}}/bindings/ffi"
# Use release binaries rather than compiling the binding generator.
tools."github:boltffi/boltffi" = "0.30.1"

# ---------------------------------------------------------------------------
# Generation. Cargo owns compilation freshness. Packaging runs each time because
# copied binaries retain old timestamps and sentinel files miss partial outputs.

[tasks."ffi:wasm"]
extends = "ffi"
tools.node = "{{vars.node_version}}"
tools."npm:typescript" = "5.9.3"
description = "Generate and package the wasm bindings"
run = "boltffi pack wasm --deny-skipped"

# BoltFFI invokes npx tsc on Windows; select TypeScript, not the npm tsc package.
[tasks."ffi:wasm".env]
npm_config_package = "typescript@5.9.3"
npm_config_yes = "true"

[tasks."ffi:apple"]
description = "Generate and package the Apple bindings (needs Xcode)"
extends = "ffi"
run = [
  "rustup target add aarch64-apple-darwin x86_64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios",
  "boltffi pack apple --deny-skipped",
]

[tasks."ffi:apple".env]
MACOSX_DEPLOYMENT_TARGET = "13.0"
IPHONEOS_DEPLOYMENT_TARGET = "16.0"

[tasks."ffi:android"]
description = "Generate and package the Android bindings (needs the NDK; ANDROID_NDK_HOME must be set)"
extends = "ffi"
run = [
  "rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android",
  "boltffi pack android --deny-skipped",
]

[tasks."ffi:csharp"]
description = "Generate and package Debug .NET bindings"
extends = "ffi"
tools.dotnet = "{{vars.dotnet_version}}"
run = "{% if os() == 'windows' %}powershell -NoProfile -File ../../surfaces/windows/build-bindings.ps1{% else %}boltffi pack csharp --deny-skipped --overlay csharp-debug.toml{% endif %}"

[tasks."ffi:csharp:release"]
description = "Generate and package Release .NET bindings"
extends = "ffi"
tools.dotnet = "{{vars.dotnet_version}}"
run = "{% if os() == 'windows' %}powershell -NoProfile -File ../../surfaces/windows/build-bindings.ps1 -Release{% else %}boltffi pack csharp --release --deny-skipped --overlay csharp-release.toml{% endif %}"

[tasks.i18n]
description = "Generate every surface's string resources and typed accessors from product/i18n/locales"
run = "cargo run --quiet -p arut-dev -- i18n"

[tasks.install]
extends = "javascript"
description = "Generate the wasm package and install the JavaScript workspace"
depends = ["ffi:wasm"]
run = "pnpm install"

# ---------------------------------------------------------------------------
# Checks. `check` fans out to the parts, which mise runs concurrently; CI and
# humans call the same entry point.

[tasks."check:rust"]
tools."cargo:cargo-nextest" = "0.9.144"
tools."cargo:cargo-machete" = "0.9.2"
description = "Format, lint, test, and prune the Rust workspace"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo nextest run --workspace",
  "cargo test --doc --workspace",
  "cargo machete",
]

[tasks.bindings]
description = "Generate native public exports over the FFI binding packages"
run = "cargo run --quiet -p arut-dev -- bindings"

[tasks."check:bindings"]
description = "Check generated binding facades and forbid direct FFI imports in surfaces"
run = "cargo run --quiet -p arut-dev -- bindings --check"

[tasks."check:layers"]
description = "Enforce architectural dependency and executor boundaries"
run = "cargo run --quiet -p arut-dev -- layers --check"

[tasks."check:wasm"]
description = "Build the isolated wasm core crates; check:layers guards their graphs"
run = "cargo check -p arut_ffi -p arut-i18n --target wasm32-unknown-unknown"

[tasks."check:proto"]
tools.buf = "1.72.0"
description = "Lint Protobuf contracts and reject breaking changes against master"
run = ["buf lint", "buf breaking --against '.git#branch=master'"]

[tasks."check:i18n"]
description = "Fail if a generated string resource disagrees with product/i18n/locales (ADR 0022)"
run = "cargo run --quiet -p arut-dev -- i18n --check"

[tasks."check:deps"]
tools."cargo:cargo-deny" = "0.20.2"
description = "Licenses, advisories, and duplicate versions across the Rust graph"
run = "cargo deny check"

[tasks."check:ts"]
extends = "javascript"
description = "Type-check the TypeScript workspace"
depends = ["install"]
run = "pnpm check"

[tasks.check]
description = "Everything CI checks, in one command"
depends = ["check:bindings", "check:layers", "check:rust", "check:wasm", "check:proto", "check:i18n", "check:deps", "check:ts"]

# ---------------------------------------------------------------------------
# Build and run.

[tasks.build]
extends = "javascript"
description = "Build the Linux surface, daemon, and web apps"
depends = ["install"]
run = [
  "cargo build -p arut-linux -p arut-runtime-local",
  "pnpm build",
]

[tasks.fmt]
tools.buf = "1.72.0"
description = "Format Rust and Protobuf sources in place"
run = ["cargo fmt --all", "buf format -w"]

[tasks.test]
tools."cargo:cargo-nextest" = "0.9.144"
description = "Run the Rust tests"
run = "cargo nextest run --workspace"

[tasks."node:local"]
description = "Run the local node daemon"
run = "cargo run -p arut-runtime-local --bin arutd"

[tasks."surface:linux"]
description = "Run the Linux GTK4 surface"
run = "cargo run -p arut-linux"

[tasks."build:windows"]
extends = "dotnet"
description = "Build the native WinUI desktop app and Rust DLL on Windows x64"
depends = ["ffi:csharp"]
run = "dotnet build surfaces/windows/Arut.Windows.csproj"

[tasks."surface:windows"]
extends = "dotnet"
description = "Build and launch the native Windows desktop app"
depends = ["build:windows"]
run = "dotnet run --project surfaces/windows/Arut.Windows.csproj --no-build"

[tasks."check:windows"]
description = "Build WinUI, test .NET observation, and check formatting and shared contracts"
depends = ["build:windows", "check:observers-dotnet", "check:format-dotnet", "check:bindings", "check:i18n", "check:layers"]

[tasks."tools:dotnet"]
extends = "dotnet"
description = "Restore the pinned .NET formatter"
run = "dotnet tool restore"

[tasks."fmt:dotnet"]
extends = "dotnet"
description = "Format handwritten C#, XAML, and .NET XML files"
depends = ["tools:dotnet"]
run = "dotnet csharpier format NuGet.Config bindings/dotnet surfaces/windows"

[tasks."check:format-dotnet"]
extends = "dotnet"
description = "Check C#, XAML, and .NET XML formatting without changing files"
depends = ["tools:dotnet"]
run = "dotnet csharpier check NuGet.Config bindings/dotnet surfaces/windows"

[tasks."publish:windows"]
extends = "dotnet"
description = "Publish a self-contained Windows x64 app folder"
depends = ["ffi:csharp:release"]
run = "dotnet publish surfaces/windows/Arut.Windows.csproj -c Release -o surfaces/windows/bin/publish"

[tasks."surface:web"]
extends = "javascript"
description = "Run the web surface with hot reload"
depends = ["install"]
run = "pnpm --filter @arut/surface-web dev"

[tasks."surface:android"]
description = "Build the Android surface (needs the Android SDK and NDK)"
depends = ["ffi:android"]
run = "gradle -p surfaces/android assembleDebug"

[tasks."surface:android".tools]
java = "21"
gradle = "8.9"

[tasks."surface:apple-project"]
description = "Generate the Apple Xcode project (needs Xcode)"
depends = ["ffi:apple"]
run = "xcodegen generate --use-cache --spec surfaces/apple/project.yml"

[tasks."surface:apple-project".tools]
xcodegen = "2.46.0"

[tasks."surface:macos"]
description = "Build the macOS app without signing (needs Xcode)"
depends = ["surface:apple-project"]
run = "xcodebuild -project surfaces/apple/Arut.xcodeproj -scheme ArutMac -configuration Debug -destination 'platform=macOS' -derivedDataPath surfaces/apple/DerivedData build CODE_SIGNING_ALLOWED=NO"

[tasks."check:apple"]
description = "Build the macOS app and test the Swift bindings (needs Xcode)"
depends = ["surface:macos"]
run = "swift test --package-path bindings/swift"

[tasks.clean]
description = "Remove Cargo outputs, generated bindings, and JavaScript installs/builds"
run = "cargo clean && rm -rf bindings/generated node_modules surfaces/*/dist surfaces/*/node_modules bindings/typescript/node_modules"
run_windows = "powershell -NoProfile -File tools/dev/clean.ps1"

[tasks."check:observers-kotlin"]
description = "Test Kotlin observation without the Android SDK or native FFI package"
run = "gradle -p bindings/kotlin/observer-tests test"

[tasks."check:observers-kotlin".tools]
java = "temurin-17.0.20+101"
gradle = "8.12.1"

[tasks."check:observers-dotnet"]
extends = "dotnet"
description = "Test .NET observation without WinUI or the native FFI package"
run = "dotnet test bindings/dotnet/tests/Arut.Observer.Tests.csproj"

[tasks."review:linux"]
description = "Capture Linux states on an isolated Hyprland output at three sizes, then clean up"
run = "bash surfaces/linux/review.sh"
