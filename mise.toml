# mise pins every tool and owns the task graph; each ecosystem keeps its own
# build system (ADR 0026). Tasks that belong to one surface live in that
# surface's `mise.toml` and are namespaced `//surfaces/linux:run`; the `alias`
# field keeps the repository-wide names (`surface:linux`) working from here.
#
# Linux also needs system GTK >= 4.22, C/C++ compilers and pkg-config; CI lists
# the Fedora packages. Platform toolchains (dotnet, java, gradle, xcodegen) are
# scoped to the tasks that need them, so a Windows build never installs Node.
# Machine-specific tuning goes in mise.local.toml (gitignored), for example
# `[env] CARGO_BUILD_JOBS = "4"` on a memory-constrained laptop.

monorepo_root = true

[settings]
lockfile = true
cargo.binstall = true
cargo.binstall_only = true
# Input groups, the workspace project graph and `mise run --affected` are all
# gated on this.
experimental = true
# Freshness compares blake3 hashes of the sources, not their timestamps. A
# fresh clone, a `git checkout` or a copied binary rewrites mtimes without
# changing content, and CI restores the task state from a cache, so timestamps
# would report work that is already done as stale.
task.source_freshness_hash_contents = true

[monorepo]
config_roots = [
  "bindings/ffi",
  "surfaces/android",
  "surfaces/apple",
  "surfaces/linux",
  "surfaces/web",
  "surfaces/windows",
]
# One lockfile at the root, including tools a subdirectory config asks for.
lockfile = true

# mise infers the project graph from Cargo.toml path dependencies and the pnpm
# workspace, which is where `mise run --affected` gets its reverse-dependency
# edges. The four directories below belong to no package manager mise reads, so
# they are declared here; without them a Kotlin or Gradle change would look
# like a change to nothing.
[monorepo.projects."bindings:kotlin"]
root = "bindings/kotlin"
depends_add = ["cargo:arut_ffi"]

[monorepo.projects."bindings:swift"]
root = "bindings/swift"
depends_add = ["cargo:arut_ffi"]

[monorepo.projects."bindings:dotnet"]
root = "bindings/dotnet"
depends_add = ["cargo:arut_ffi"]

[monorepo.projects."surface:android"]
root = "surfaces/android"
depends_add = ["bindings:kotlin"]

[monorepo.projects."surface:apple"]
root = "surfaces/apple"
depends_add = ["bindings:swift"]

[monorepo.projects."surface:windows"]
root = "surfaces/windows"
depends_add = ["bindings:dotnet"]

[tools]
cargo-binstall = "1.23.0"
# mr-boxington caches rustc invocations in a content-addressed store shared by
# every checkout and worktree, and mise's `mr_boxington` option wraps cargo so
# no shim setup is needed. Incremental compilation stays local and untouched.
mr-boxington = "1.11.0"
rust = { version = "1.98.1", mr_boxington = true, components = ["rustfmt", "clippy"], targets = ["wasm32-unknown-unknown"] }
# Everything else installs only with the task that consumes it.

[vars]
dotnet_version = "10.0.401"
node_version = "26.8.2"
# Must equal the pnpm-workspace.yaml catalog pin.
typescript_version = "7.0.2"

# ---------------------------------------------------------------------------
# Task inputs. Groups are resolved relative to the config file that defines
# them and are not inherited by subdirectory configs, so a surface config that
# needs the Rust sources spells them out itself.

[task_config.input_groups]
toolchain = ["mise.toml", "mise.lock"]
manifests = ["Cargo.toml", "Cargo.lock", "**/Cargo.toml", "!target/**", "!node_modules/**"]
# What `mise run generate` writes. `arut-dev check` compares these against the
# Fluent sources and the handle descriptors, so editing one has to re-run the
# check that would catch it. `outputs` cannot reference a group, so the
# generate task repeats these paths.
generated = [
  "bindings/ffi/src/generated/handles.rs",
  "bindings/kotlin/src/main/kotlin/dev/arut/bindings/generated/Messages.kt",
  "bindings/kotlin/src/main/res/**/strings.xml",
  "bindings/typescript/src/generated/*.ts",
  "surfaces/apple/shared/Sources/ArutSurface/Generated/L10n.swift",
  "surfaces/apple/shared/Sources/ArutSurface/Resources/Localizable.xcstrings",
  "surfaces/windows/Generated/L10n.cs",
  "surfaces/windows/Strings/**/Resources.resw",
]
rust = [
  "@group:manifests",
  "@group:toolchain",
  "@group:generated",
  "bindings/ffi/**/*.rs",
  "bindings/ffi/*.toml",
  "features/**/*.rs",
  "product/**/*.rs",
  "protocols/**/*.rs",
  "protocols/proto/**/*.proto",
  "product/i18n/locales/**/*.ftl",
  "runtimes/host-polled/**/*.rs",
  "runtimes/local/**/*.rs",
  "substrates/**/*.rs",
  "surfaces/linux/**/*.rs",
  "surfaces/windows/**/*.rs",
  "tools/conformance/**/*.rs",
  "tools/dev/**/*.rs",
  "transports/**/*.rs",
]
js-manifests = [
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "bindings/typescript/package.json",
  "runtimes/browser/package.json",
  "surfaces/*/package.json",
  "bindings/generated/wasm/pkg/package.json",
  "@group:toolchain",
]
js = [
  "@group:js-manifests",
  "tsconfig.json",
  "tsconfig.node.json",
  "bindings/generated/wasm/pkg/**",
  "bindings/typescript/**/*.ts",
  "bindings/typescript/**/*.mjs",
  "runtimes/browser/**/*.ts",
  "surfaces/chat-ui/**/*.ts",
  "surfaces/chat-ui/**/*.tsx",
  "surfaces/chromium/**/*.ts",
  "surfaces/vscode/**/*.ts",
  "surfaces/web/**/*.ts",
  "surfaces/web/**/*.tsx",
  "surfaces/*/*.json",
  "surfaces/*/*.html",
  "!**/node_modules/**",
  "!**/dist/**",
]

# ---------------------------------------------------------------------------
# Shared tool scoping. A template's tools install with the tasks that extend
# it, never with a bare `mise install`.

[task_templates.dotnet]
tools.dotnet = "{{vars.dotnet_version}}"

[task_templates.javascript]
tools.node = "{{vars.node_version}}"
tools.pnpm = "12.4.1"

# AGP 9.4.0 (surfaces/android/gradle/libs.versions.toml) requires Gradle 9.6+,
# so Gradle tracks the newest 9.x. Java does not track the newest: Gradle runs
# on JVM 17 through 26 and rejects 27, and of what is left this takes the
# current LTS, because nothing in this repo's CI matrix builds Android and a
# non-LTS JDK would be pinned with nothing proving it works.
[task_templates.jvm]
tools.java = "25"
tools.gradle = "9.7.1"

# Templates are read from this file only, so the binding generator's pin lives
# here even though its tasks live in bindings/ffi/mise.toml.
[task_templates.ffi]
tools."github:boltffi/boltffi" = "0.30.1"

# ---------------------------------------------------------------------------
# Generation and installation.

[tasks.generate]
description = "Regenerate every localization resource and handle descriptor"
run = "cargo run --quiet -p arut-dev -- generate"
sources = [
  "product/i18n/locales/**/*.ftl",
  "product/i18n/**/*.rs",
  "bindings/ffi/handles.toml",
  "tools/dev/**/*.rs",
  "@group:manifests",
]
outputs = [
  "bindings/ffi/src/generated/handles.rs",
  "bindings/kotlin/src/main/kotlin/dev/arut/bindings/generated/Messages.kt",
  "bindings/kotlin/src/main/res",
  "bindings/typescript/src/generated/catalog.ts",
  "bindings/typescript/src/generated/l10n.ts",
  "surfaces/apple/shared/Sources/ArutSurface/Generated/L10n.swift",
  "surfaces/apple/shared/Sources/ArutSurface/Resources/Localizable.xcstrings",
  "surfaces/windows/Generated/L10n.cs",
  "surfaces/windows/Strings",
]

[tasks.install]
extends = "javascript"
description = "Generate the wasm package and install the JavaScript workspace"
depends = ["//bindings/ffi:wasm"]
run = "pnpm install"
sources = ["@group:js-manifests"]
# pnpm writes this on every successful install, so deleting node_modules
# re-runs the task even when the lockfiles have not moved.
outputs = ["node_modules/.modules.yaml"]

# ---------------------------------------------------------------------------
# Checks. All cargo work is one task so it does not fight the build lock; the
# independent gates run concurrently beside it. CI calls `check`, same as
# humans. `check:rust` and `check:core-graph` are scripts under mise-tasks/.

[tasks."check:proto"]
tools.buf = "1.73.0"
description = "Lint Protobuf contracts and reject breaking changes against master"
# Deliberately no sources: `buf breaking` compares against the master branch,
# which moves without any file in the working tree changing.
run = ["buf lint", "buf breaking --against '.git#branch=master'"]

[tasks."check:deps"]
tools."aqua:EmbarkStudios/cargo-deny" = "0.20.2"
description = "Licenses, advisories, duplicates across the Rust graph (needs network)"
# Deliberately no sources: the advisory database changes on its own, so an
# unchanged Cargo.lock is not evidence that the answer is unchanged.
run = "cargo deny check"

[tasks."check:ts"]
extends = "javascript"
description = "Type-check the TypeScript workspace and run the store tests"
depends = ["install"]
run = "pnpm check"
sources = ["@group:js"]

[tasks.check]
description = "Everything CI checks, in one command"
depends = ["check:rust", "check:core-graph", "check:proto", "check:deps", "check:ts"]

# ---------------------------------------------------------------------------
# Build and run.

[tasks."build:rust"]
description = "Build the Linux surface and the local node daemon"
run = "cargo build -p arut-linux -p arut-runtime-local"
sources = ["@group:rust"]
# The two binaries, never `target/`: cargo owns everything else in there.
outputs = ["target/debug/arut-linux", "target/debug/arutd"]

[tasks."build:js"]
extends = "javascript"
description = "Build the web, Chromium, and VS Code bundles"
depends = ["install"]
run = "pnpm build"
sources = ["@group:js"]
outputs = ["surfaces/web/dist", "surfaces/chromium/dist", "surfaces/vscode/dist"]

[tasks.build]
description = "Build the Linux surface, daemon, and web/Chromium/VS Code bundles"
depends = ["build:rust", "build:js"]

[tasks.fmt]
tools.buf = "1.73.0"
description = "Format Rust and Protobuf sources in place"
run = ["cargo fmt --all", "buf format -w"]

[tasks.test]
tools."cargo:cargo-nextest" = "0.9.144"
description = "Run the Rust tests"
run = "cargo nextest run --workspace"

[tasks."node:local"]
description = "Run the local node daemon"
run = "cargo run -p arut-runtime-local --bin arutd"

[tasks.clean]
description = "Remove Cargo outputs, generated bindings, and JavaScript installs/builds"
run = "cargo clean && rm -rf bindings/generated node_modules surfaces/*/dist surfaces/*/node_modules bindings/typescript/node_modules"
run_windows = "cargo clean; powershell -NoProfile -Command \"'bindings/generated','node_modules','bindings/typescript/node_modules' + (Get-ChildItem surfaces -Directory | ForEach-Object { \\\"surfaces/$($_.Name)/dist\\\", \\\"surfaces/$($_.Name)/node_modules\\\" }) | Where-Object { Test-Path $_ } | Remove-Item -Recurse -Force\""
