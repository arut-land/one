[tools]
rust = { version = "1.98.0", components = ["rustfmt", "clippy"], targets = ["wasm32-unknown-unknown"] }
node = "26.8.2"
pnpm = "12.3.4"
buf = "1.72.0"
"cargo:boltffi_cli" = "0.30.1"
"cargo:cargo-nextest" = "0.9.144"
"cargo:cargo-machete" = "0.9.2"
"cargo:cargo-deny" = "0.20.2"

[tasks.install]
description = "Generate the wasm bindings and install the JavaScript workspace"
depends = ["ffi:wasm"]
run = "pnpm install"

[tasks.i18n]
description = "Generate every surface's string resources from product/i18n/locales"
run = "cargo run --quiet -p arut-i18n-gen"

[tasks.check]
description = "Check Rust, protocols, and TypeScript"
depends = ["install"]
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo nextest run --workspace",
  "cargo test --doc --workspace",
  "cargo machete",
  "cargo check -p arut_ffi --target wasm32-unknown-unknown",
  "cargo check -p arut-i18n --target wasm32-unknown-unknown",
  "mise run check:wasm-graph",
  "buf lint",
  "buf breaking --against '.git#branch=master'",
  "pnpm check",
  # ADR 0022: the .ftl files are the source, so a generated resource that
  # disagrees with them is a change nobody made on purpose.
  "cargo run --quiet -p arut-i18n-gen -- --check",
]

[tasks.build]
description = "Build the surfaces this machine can build"
depends = ["install"]
run = [
  "cargo build -p arut-linux-gtk -p arut-runtime-local",
  "pnpm build",
]

[tasks."protocol:breaking"]
description = "Check protobuf changes for breakage against master"
run = "buf breaking --against '.git#branch=master'"

[tasks."ffi:wasm"]
description = "Generate and package the wasm bindings"
dir = "{{config_root}}/bindings/ffi"
run = "rm -rf ../generated/wasm && boltffi pack wasm --deny-skipped"

[tasks."ffi:apple"]
description = "Generate and package the Apple bindings"
dir = "{{config_root}}/bindings/ffi"
run = "rm -rf ../generated/apple && boltffi pack apple --deny-skipped"

[tasks."ffi:android"]
description = "Generate and package the Android bindings"
dir = "{{config_root}}/bindings/ffi"
run = "rm -rf ../generated/android && boltffi pack android --deny-skipped"

[tasks."ffi:csharp"]
description = "Generate and package the .NET bindings"
dir = "{{config_root}}/bindings/ffi"
run = "rm -rf ../generated/csharp && boltffi pack csharp --deny-skipped"

[tasks."ffi:csharp".tools]
dotnet = "10"

[tasks."surface:linux"]
description = "Run the Linux GTK4 surface"
run = "cargo run -p arut-linux-gtk"

[tasks."surface:web"]
description = "Run the web surface"
depends = ["install"]
run = "pnpm --filter @arut/surface-web dev"

[tasks."surface:android"]
description = "Build the Android surface"
depends = ["ffi:android"]
run = "gradle -p surfaces/android assembleDebug"

[tasks."surface:android".tools]
java = "21"
gradle = "8.9"

[tasks."surface:apple-project"]
description = "Generate the Apple Xcode project"
depends = ["ffi:apple"]
run = "xcodegen generate --spec surfaces/apple/project.yml"

[tasks."surface:apple-project".tools]
xcodegen = "2.46.0"

[tasks."node:local"]
description = "Run the local node daemon"
run = "cargo run -p arut-runtime-local --bin arutd"

[tasks."check:wasm-graph"]
description = "Reject wasm-bindgen in the isolated core graphs"
run = '''graph="$(cargo tree -p arut_ffi -p arut-i18n --target wasm32-unknown-unknown --prefix none --format '{p}')" || exit "$?"
case "$graph" in
  *"wasm-bindgen v"*) echo 'wasm-bindgen reached an isolated wasm graph'; exit 1 ;;
esac
'''
