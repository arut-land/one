# Linux also needs system GTK >= 4.20, C/C++ compilers and pkg-config; CI lists
# the Fedora packages. Platform toolchains (dotnet, java, gradle, xcodegen) are
# scoped to the tasks that need them, so a Windows build never installs Node.
# Machine-specific tuning goes in mise.local.toml (gitignored), for example
# `[env] CARGO_BUILD_JOBS = "4"` on a memory-constrained laptop.

[settings]
lockfile = true
cargo.binstall = true
cargo.binstall_only = true

[tools]
cargo-binstall = "1.23.0"
rust = { version = "1.98.1", components = ["rustfmt", "clippy"], targets = ["wasm32-unknown-unknown"] }
# Everything else installs only with the task that consumes it.

[vars]
dotnet_version = "10.0.401"
node_version = "26.8.2"
# Must equal the pnpm-workspace.yaml catalog pin.
typescript_version = "5.9.3"

[task_templates.dotnet]
tools.dotnet = "{{vars.dotnet_version}}"

[task_templates.javascript]
tools.node = "{{vars.node_version}}"
tools.pnpm = "12.3.4"

[task_templates.jvm]
tools.java = "21"
tools.gradle = "8.12.1"

[task_templates.ffi]
dir = "{{config_root}}/bindings/ffi"
# Use release binaries rather than compiling the binding generator.
tools."github:boltffi/boltffi" = "0.30.1"

# ---------------------------------------------------------------------------
# Generation. Cargo owns compilation freshness. Packaging runs each time because
# copied binaries retain old timestamps and sentinel files miss partial outputs.

[tasks."ffi:wasm"]
extends = "ffi"
tools.node = "{{vars.node_version}}"
tools."npm:typescript" = "{{vars.typescript_version}}"
description = "Generate and package the wasm bindings"
run = "boltffi pack wasm --deny-skipped"

# BoltFFI invokes npx tsc on Windows; select TypeScript, not the npm tsc package.
[tasks."ffi:wasm".env]
npm_config_package = "typescript@{{vars.typescript_version}}"
npm_config_yes = "true"

[tasks."ffi:apple"]
extends = "ffi"
description = "Generate and package the Apple bindings (needs Xcode)"
run = [
  "rustup target add aarch64-apple-darwin x86_64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios",
  "boltffi pack apple --deny-skipped",
]

[tasks."ffi:apple".env]
MACOSX_DEPLOYMENT_TARGET = "13.0"
IPHONEOS_DEPLOYMENT_TARGET = "16.0"

[tasks."ffi:android"]
extends = "ffi"
description = "Generate and package the Android bindings (needs the NDK; ANDROID_NDK_HOME must be set)"
run = [
  "rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android",
  "boltffi pack android --deny-skipped",
]

[tasks."ffi:csharp"]
extends = "ffi"
tools.dotnet = "{{vars.dotnet_version}}"
description = "Generate and package the .NET bindings; pass --release for Release"
run = "{% if os() == 'windows' %}powershell -NoProfile -File ../../surfaces/windows/build-bindings.ps1 {{arg(name='flags', var=true, default='')}}{% else %}boltffi pack csharp --deny-skipped {{arg(name='flags', var=true, default='')}} --overlay csharp-{{ 'release' if '--release' in arg(name='flags', var=true, default='') else 'debug' }}.toml{% endif %}"

[tasks.generate]
description = "Regenerate every localization resource from product/i18n/locales"
run = "cargo run --quiet -p arut-dev -- generate"

[tasks.install]
extends = "javascript"
description = "Generate the wasm package and install the JavaScript workspace"
depends = ["ffi:wasm"]
run = "pnpm install"

# ---------------------------------------------------------------------------
# Checks. All cargo work is one task so it does not fight the build lock; the
# independent gates run concurrently beside it. CI calls `check`, same as humans.

[tasks."check:rust"]
tools."cargo:cargo-nextest" = "0.9.144"
tools."cargo:cargo-machete" = "0.9.2"
description = "Format, lint, test, prune, build the isolated wasm core, and check generated output"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo nextest run --workspace",
  "cargo test --doc --workspace",
  "cargo machete",
  "cargo check --target wasm32-unknown-unknown -p arut_ffi -p arut-i18n -p arut-feature-chat -p arut-product-session -p arut-watch -p arut-storage -p arut-authority",
  "cargo run --quiet -p arut-dev -- check",
]

# docs/ECOSYSTEM.md names this assertion by name: the wasm core carries no
# wasm-bindgen and no Tokio executor, and no core crate opts out of the
# workspace's unsafe_code deny.
[tasks."check:core-graph"]
description = "Assert the isolated core graph and its unsafe-code lint"
run = '''
test -z "$(cargo tree -i wasm-bindgen --target wasm32-unknown-unknown -p arut_ffi)" \
  || { echo "arut_ffi reaches wasm-bindgen"; exit 1; }
test -z "$(cargo tree -e features -p arut_ffi --target wasm32-unknown-unknown | grep -E 'tokio.*(rt|rt-multi-thread)')" \
  || { echo "arut_ffi reaches a Tokio executor"; exit 1; }
test -z "$(grep -rn 'allow(unsafe_code)' features product substrates bindings)" \
  || { echo "a core crate opts out of the unsafe_code deny"; exit 1; }
'''

[tasks."check:proto"]
tools.buf = "1.72.0"
description = "Lint Protobuf contracts and reject breaking changes against master"
run = ["buf lint", "buf breaking --against '.git#branch=master'"]

[tasks."check:deps"]
tools."aqua:EmbarkStudios/cargo-deny" = "0.20.2"
description = "Licenses, advisories, duplicates across the Rust graph (needs network)"
run = "cargo deny check"

[tasks."check:ts"]
extends = "javascript"
description = "Type-check the TypeScript workspace"
depends = ["install"]
run = "pnpm check"

[tasks.check]
description = "Everything CI checks, in one command"
depends = ["check:rust", "check:core-graph", "check:proto", "check:deps", "check:ts"]

# ---------------------------------------------------------------------------
# Build and run.

[tasks.build]
extends = "javascript"
description = "Build the Linux surface, daemon, and web/Chromium/VS Code bundles"
depends = ["install"]
run = ["cargo build -p arut-linux -p arut-runtime-local", "pnpm build"]

[tasks.fmt]
tools.buf = "1.72.0"
description = "Format Rust and Protobuf sources in place"
run = ["cargo fmt --all", "buf format -w"]

[tasks.test]
tools."cargo:cargo-nextest" = "0.9.144"
description = "Run the Rust tests"
run = "cargo nextest run --workspace"

[tasks."node:local"]
description = "Run the local node daemon"
run = "cargo run -p arut-runtime-local --bin arutd"

[tasks."surface:linux"]
description = "Run the Linux GTK4 surface"
run = "cargo run -p arut-linux"

[tasks."surface:web"]
extends = "javascript"
description = "Run the web surface with hot reload"
depends = ["install"]
run = "pnpm --filter @arut/surface-web dev"

[tasks."review:linux"]
description = "Capture Linux states on an isolated Hyprland output at three sizes, then clean up"
run = "bash tools/review-linux.sh"

# ---------------------------------------------------------------------------
# Windows. The shared repository checks run in the Linux job, not here.

[tasks."build:windows"]
extends = "dotnet"
description = "Build the native WinUI desktop app and Rust DLL on Windows x64"
depends = ["ffi:csharp"]
run = "dotnet build surfaces/windows/Arut.Windows.csproj"

[tasks."surface:windows"]
extends = "dotnet"
description = "Build and launch the native Windows desktop app"
depends = ["build:windows"]
run = "dotnet run --project surfaces/windows/Arut.Windows.csproj --no-build"

[tasks."publish:windows"]
extends = "dotnet"
description = "Publish a self-contained Windows x64 app folder"
run = "mise run ffi:csharp -- --release && dotnet publish surfaces/windows/Arut.Windows.csproj -c Release -o surfaces/windows/bin/publish"

[tasks."fmt:dotnet"]
extends = "dotnet"
description = "Format C# in place; `mise run fmt:dotnet --verify-no-changes` checks instead"
run = "dotnet format surfaces/windows/Arut.Windows.csproj {{arg(name='flags', var=true, default='')}}"

[tasks."check:windows"]
extends = "dotnet"
description = "Build WinUI and check C# formatting"
depends = ["build:windows"]
run = "dotnet format surfaces/windows/Arut.Windows.csproj --verify-no-changes"

# ---------------------------------------------------------------------------
# Android and Apple.

[tasks."surface:android"]
extends = "jvm"
description = "Build the Android surface (needs the Android SDK and NDK)"
depends = ["ffi:android"]
run = "gradle -p surfaces/android assembleDebug"

[tasks."surface:apple-project"]
tools.xcodegen = "2.46.0"
description = "Generate the Apple Xcode project (needs Xcode)"
depends = ["ffi:apple"]
run = "xcodegen generate --use-cache --spec surfaces/apple/project.yml"

[tasks."surface:macos"]
description = "Build the macOS app without signing (needs Xcode)"
depends = ["surface:apple-project"]
run = "xcodebuild -project surfaces/apple/Arut.xcodeproj -scheme ArutMac -configuration Debug -destination 'platform=macOS' -derivedDataPath surfaces/apple/DerivedData build CODE_SIGNING_ALLOWED=NO"

[tasks."check:apple"]
description = "Build the macOS app and test the Swift bindings (needs Xcode)"
depends = ["surface:macos"]
run = "swift test --package-path bindings/swift"

[tasks.clean]
description = "Remove Cargo outputs, generated bindings, and JavaScript installs/builds"
run = "cargo clean && rm -rf bindings/generated node_modules surfaces/*/dist surfaces/*/node_modules bindings/typescript/node_modules"
run_windows = "cargo clean; powershell -NoProfile -Command \"'bindings/generated','node_modules','bindings/typescript/node_modules' + (Get-ChildItem surfaces -Directory | ForEach-Object { \\\"surfaces/$($_.Name)/dist\\\", \\\"surfaces/$($_.Name)/node_modules\\\" }) | Where-Object { Test-Path $_ } | Remove-Item -Recurse -Force\""
