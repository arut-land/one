[package]
name = "arut-runtime-local"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
arut-runtime-host-polled.workspace = true
arut-feature-chat.workspace = true
arut-product-session.workspace = true
arut-protocol.workspace = true
arut-rpc.workspace = true
arut-storage = { workspace = true, features = ["redb"] }
arut-transport-connect-http.workspace = true
arut-transport-ipc.workspace = true
axum = "0.8.4"
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "signal", "process", "io-util"] }

[dev-dependencies]
futures-util = "0.3.31"

[[bin]]
name = "arutd"
path = "src/main.rs"

[lints]
workspace = true
