[package]
name = "arut-runtime-local"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
arut-runtime-host-polled.workspace = true
arut-feature-chat.workspace = true
arut-i18n-macros.workspace = true
arut-product-session.workspace = true
arut-protocol.workspace = true
arut-rpc.workspace = true
arut-storage = { workspace = true, features = ["redb"] }
arut-transport.workspace = true
axum = "0.8.4"
thiserror = "2.0.20"
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "signal", "process", "io-util", "io-std"] }
process-wrap = { version = "10", default-features = false, features = ["tokio1", "process-group", "job-object", "kill-on-drop"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["process"] }

[dev-dependencies]
futures-util = "0.3.31"

[[bin]]
name = "arutd"
path = "src/main.rs"

[lints]
workspace = true
