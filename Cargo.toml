[workspace]
resolver = "3"
members = [
    "bindings/observation",
    "bindings/ffi",
    "runtimes/local",
    "features/chat",
    "protocols",
    "protocols/build",
    "protocols/rpc",
    "product/session",
    "substrates/watch",
    "surfaces/linux-gtk",
    "transports/http",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
arut-feature-chat = { path = "features/chat" }
arut-protocol = { path = "protocols" }
arut-product-session = { path = "product/session" }
arut-rpc = { path = "protocols/rpc" }
arut-watch = { path = "substrates/watch" }
arut-transport-http = { path = "transports/http" }

arut-observation = { path = "bindings/observation" }
