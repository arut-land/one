[workspace]
resolver = "3"
members = [
    "bindings/ffi",
    "features/chat",
    "product/i18n",
    "product/i18n/macros",
    "product/session",
    "protocols",
    "protocols/build",
    "protocols/rpc",
    "runtimes/host-polled",
    "runtimes/local",
    "substrates/authority",
    "substrates/storage",
    "substrates/watch",
    "surfaces/linux-gtk",
    "tools/conformance",
    "tools/i18n",
    "transports/connect-http",
    "transports/ipc",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
arut-authority = { path = "substrates/authority" }
arut-feature-chat = { path = "features/chat" }
arut-i18n = { path = "product/i18n" }
arut-i18n-macros = { path = "product/i18n/macros" }
arut-product-session = { path = "product/session" }
arut-protocol = { path = "protocols" }
arut-rpc = { path = "protocols/rpc" }
arut-runtime-host-polled = { path = "runtimes/host-polled" }
arut-runtime-local = { path = "runtimes/local" }
arut-storage = { path = "substrates/storage" }
arut-transport-connect-http = { path = "transports/connect-http" }
arut-transport-ipc = { path = "transports/ipc" }
arut-watch = { path = "substrates/watch" }

[workspace.lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
cloned_instead_of_copied = "warn"
explicit_iter_loop = "warn"
ignored_unit_patterns = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
items_after_statements = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
match_same_arms = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
semicolon_if_nothing_returned = "warn"
str_to_string = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
unused_self = "warn"
wildcard_imports = "warn"
