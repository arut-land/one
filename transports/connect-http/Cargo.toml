[dependencies]
arut-rpc.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = "0.8.4"
base64 = "0.22"
futures-util = "0.3.31"
reqwest = { version = "0.13.2", default-features = false, features = ["rustls", "stream", "json"] }
serde_json = "1"
